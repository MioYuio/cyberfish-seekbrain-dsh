- insert:
    - id: cyberfish-seekbrain
      name: cyberfish-seekbrain
    - id: cyberfish-copilotj-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: copilotj
        transport: streamable-http
        url: !!js process.env.COPILOTJ_MCP_URL || 'http://127.0.0.1:3001/mcp'
        failOnStartupError: false
        # toolLoading / startupTimeoutMs are NOT supported on DSH 0.2.0-rc.2;
        # they exist only on 0.2.2+/0.2.3+. Removed to match declared engines floor.
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
    - id: cyberfish-brainpilot-auditor
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js process.env.CYBERFISH_ENABLE_AUDIT_SUBAGENT !== '1'
      config:
        provider: spawn
        toolName: brainpilot_auditor
        # modelSelection / modelDiscovery are NOT supported on DSH 0.2.0-rc.2;
        # defaults already match the intended behaviour, so the keys are dropped.
        maxDepth: 1
